[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natk"
version = "1.0.0"
description = "Network Automation Toolkit - multi-vendor device management"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
